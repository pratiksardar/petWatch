# Shared core: power, network, and the sensing logic.
#
# Included by ../pet-watch.yaml (pulse/trig-echo sensors) and
# ../pet-watch-uart.yaml (UART sensors). Keeping this in one place is what stops
# the two entry points from drifting apart.
#
# The display deliberately lives elsewhere — see common/display-max7219.yaml.
# It is cosmetic: nothing in this file depends on it, so the device is fully
# functional as a sensor without any display at all.
#
# The including file must supply these substitutions:
#   device_name, friendly_name, dist_empty_mm, dist_full_mm
# and exactly one sensor package, which must define `id: box_distance`.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  # DEBUG so the 50 ms sensor publishes are visible — at INFO the log console
  # shows connection chatter only and looks dead while the device works fine.
  # Flip to INFO once calibration is done if the stream feels noisy.
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    # Encrypted OTA keyed off the API key rather than a separate password:
    # ESPHome reports the password form costs ~3.5 KB of flash and ~60 bytes of
    # heap for no security gain, since the API key already authenticates
    # uploaders and OTA encryption is required either way.
    encryption:
      key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${device_name} fallback"

captive_portal:

# Built-in webpage — the quickest way to watch this thing live, no host
# software involved: http://pet-watch.local (or the device's IP). Shows
# distance / occupancy / presence updating in place, a streaming log console,
# and the tunable occupancy threshold. In fallback-AP mode the captive portal
# takes over port 80 instead, so the two never fight.
web_server:
  port: 80

sensor:
  # Occupancy as a percentage between the two calibrated distances.
  # Reads 0 when the beam sees empty geometry, 100 when fully blocked.
  #
  # This is the raw on-device signal. The real detector — baselines, visit
  # segmentation, anomaly detection — runs on the host, because a threshold in
  # flash cannot be tuned from the couch.
  - platform: template
    id: occupancy
    name: "${friendly_name} occupancy"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 50ms
    lambda: |-
      const float empty_mm = ${dist_empty_mm};
      const float full_mm  = ${dist_full_mm};
      const float d = id(box_distance).state;

      // Ultrasonic timeouts report NaN/inf, not an error code. Not guarding
      // here makes occupancy NaN and the binary sensor flicker.
      //
      // Use the std:: forms: the ESP-IDF C++ toolchain puts cmath's functions in
      // namespace std and does not guarantee the C macros at global scope. A
      // bare isinf() fails to compile here. isfinite() covers both cases in one
      // test rather than two.
      if (!std::isfinite(d) || d <= 0.0f) return 0.0f;

      const float span = empty_mm - full_mm;
      if (span <= 0.0f) return 0.0f;   // misconfigured calibration

      float occ = (empty_mm - d) / span * 100.0f;
      if (occ < 0.0f) occ = 0.0f;
      if (occ > 100.0f) occ = 100.0f;
      return occ;

number:
  # Tune from Home Assistant without a reflash. Calibration is the one thing
  # you will want to adjust repeatedly.
  - platform: template
    id: occ_threshold
    name: "${friendly_name} occupancy threshold"
    unit_of_measurement: "%"
    optimistic: true
    min_value: 5
    max_value: 95
    step: 5
    initial_value: 35
    restore_value: true
    icon: mdi:tune

binary_sensor:
  # The debounce is what makes this usable. Without delayed_on a pet walking
  # past the doorway registers as a visit; without delayed_off a cat shifting
  # position splits one visit into three.
  - platform: template
    id: pet_present
    name: "${friendly_name} occupied"
    device_class: occupancy
    lambda: |-
      return id(occupancy).state > id(occ_threshold).state;
    filters:
      - delayed_on: 1500ms
      - delayed_off: 2500ms

  <!-- ══════════════════ NOTES ══════════════════ -->
  <rect x="440" y="744" width="1010" height="122" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="458" y="768" font-size="13" font-weight="bold" fill="#e65100">BEFORE YOU POWER UP</text>
  <text x="458" y="790" font-size="12" fill="#5d4037">1  ECHO is 5 V logic — R1 and R2 must be fitted. Straight into GPIO21 it damages the pin, often not immediately.</text>
  <text x="458" y="808" font-size="12" fill="#5d4037">2  Never put 5 V on an ESP32-C6 GPIO. Absolute maximum is about 3.6 V.</text>
  <text x="458" y="826" font-size="12" fill="#5d4037">3  Keep clear of GPIO4, 5, 8, 9, 15 (strapping) · GPIO8 (RGB LED) · GPIO12, 13 (USB) · GPIO16, 17 (serial console).</text>
  <text x="458" y="846" font-size="12" fill="#5d4037">4  The display is optional. An i2C display (SDA/SCL) needs a different driver — see wiring.md §13.</text>
</svg>
